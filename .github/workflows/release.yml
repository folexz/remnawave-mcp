name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; the runner ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Offline smoke test
        run: node scripts/smoke.mjs

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG'."
            exit 1
          fi

      # No token: authorization is via OIDC trusted publishing (configured on npmjs.com).
      - name: Publish to npm
        run: npm publish --access public
